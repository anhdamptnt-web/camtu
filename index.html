<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trang cá nhân</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: Arial, Helvetica, sans-serif;
}

body,html{
height:100%;
color:white;
overflow-x:hidden;
}

/* VIDEO NỀN */
.bg-video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
}

/* OVERLAY */
.overlay{
min-height:100vh;
background:rgba(0,0,30,0.55);
display:flex;
flex-direction:column;
align-items:center;
padding:40px 20px;
}

/* HEADER */
header{
text-align:center;
margin-bottom:30px;
}

header h1{
font-size:36px;
}

/* PROFILE */
.profile-card{
background:rgba(255,255,255,0.12);
backdrop-filter:blur(10px);
border-radius:20px;
padding:30px;
display:flex;
gap:25px;
max-width:650px;
width:100%;
margin-bottom:40px;
}

/* AVATAR TO HƠN */
.profile-card img{
width:150px;
height:150px;
border-radius:50%;
object-fit:cover;
border:3px solid rgba(255,255,255,0.6);
}

.profile-info h2{
font-size:28px;
margin-bottom:10px;
}

/* KHỐI 2/3 TRANG */
.main-box{
width:66%;
max-width:900px;
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
}

/* CARD CHUNG */
.card{
background:rgba(255,255,255,0.12);
backdrop-filter:blur(10px);
border-radius:20px;
padding:20px;
}

/* ẢNH SỞ THÍCH */
.hobby-img{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:10px;
}

.hobby-img img{
width:100%;
height:140px;
object-fit:cover;
border-radius:12px;
}

/* SPOTIFY */
iframe{
width:100%;
border-radius:12px;
}

/* FOOTER */
footer{
margin-top:40px;
opacity:0.8;
}
</style>
</head>

<body>

<!-- VIDEO + AUDIO CHUNG -->
<video class="bg-video" id="bgVideo" autoplay loop playsinline>
<source src="bg.mp4" type="video/mp4">
</video>

<div class="overlay">

<header>
<h1>Trang cá nhân</h1>
</header>

<!-- PROFILE -->
<div class="profile-card">
<img src="ctu.jpg" alt="Ảnh Đại Diện">
<div class="profile-info">
<h2>Nguyễn Cẩm Tú</h2>
<p>Sinh: 27/12/2008</p>
<p>Sở thích: Du lịch, Nghe nhạc, Thủ công</p>
<p>Màu yêu thích: Xanh than</p>
</div>
</div>

<!-- KHỐI 4 MỤC -->
<div class="main-box">

<!-- DU LỊCH -->
<div class="card">
<h3>Du lịch</h3>
<div class="hobby-img">
<img src="travel1.jpg">
<img src="travel2.jpg">
</div>
</div>

<!-- NGHE NHẠC -->
<div class="card">
<h3>Nghe nhạc</h3>
<div class="hobby-img">
<img src="music1.jpg">
<img src="music2.jpg">
</div>
</div>

<!-- THỦ CÔNG -->
<div class="card">
<h3>Thủ công</h3>
<div class="hobby-img">
<img src="craft1.jpg">
<img src="craft2.jpg">
</div>
</div>

<!-- SPOTIFY -->
<div class="card">
<h3>Nhạc yêu thích</h3>
<iframe src="https://open.spotify.com/embed/track/2gGMJDtppeGj8s11mXaHKU"></iframe>
</div>

</div>

<footer>
© 2026 Personal Website
</footer>

</div>

<script>
const video = document.getElementById("bgVideo");

/* Bật âm thanh video khi click lần đầu */
document.addEventListener("click", () => {
video.muted = false;
video.play();
},{ once:true });
</script>

</body>
</html>
