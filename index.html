<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trang cá nhân</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: Arial, Helvetica, sans-serif;
}

body,html{
height:100%;
color:white;
overflow-x:hidden;
}

/* VIDEO NỀN */
.bg-video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
filter:brightness(0.85);
}

/* OVERLAY SOFT + BLUR TINH TẾ */
.overlay{
min-height:100vh;
background:rgba(10,20,50,0.55);
backdrop-filter:blur(12px);
display:flex;
flex-direction:column;
align-items:center;
padding:50px 20px;
}

/* HEADER */
header{
text-align:center;
margin-bottom:35px;
}

header h1{
font-size:42px;
letter-spacing:1px;
font-weight:600;
}

/* PROFILE */
.profile-card{
background:rgba(255,255,255,0.18);
backdrop-filter:blur(16px);
border-radius:26px;
padding:30px;
display:flex;
gap:25px;
max-width:720px;
width:100%;
margin-bottom:45px;
box-shadow:0 10px 35px rgba(0,0,0,0.25);
}

/* AVATAR */
.profile-card img{
width:170px;
height:170px;
border-radius:50%;
object-fit:cover;
border:4px solid rgba(255,255,255,0.7);
}

/* PROFILE TEXT */
.profile-info{
display:flex;
flex-direction:column;
gap:8px;
}

.profile-info h2{
font-size:34px;
font-weight:600;
}

.profile-info p{
font-size:18px;
opacity:0.95;
}

/* KHỐI 2/3 TRANG */
.main-box{
width:70%;
max-width:1000px;
display:grid;
grid-template-columns:1fr 1fr;
gap:24px;
}

/* CARD */
.card{
background:rgba(255,255,255,0.18);
backdrop-filter:blur(16px);
border-radius:24px;
padding:22px;
box-shadow:0 8px 25px rgba(0,0,0,0.25);
}

.card h3{
font-size:22px;
margin-bottom:14px;
}

/* ẢNH HOBBY - ƯU TIÊN ẢNH DỌC TỪ ĐIỆN THOẠI */
.hobby-img{
display:grid;
grid-template-columns:1fr;
gap:12px;
}

.hobby-img img{
width:100%;
aspect-ratio:3/4;
object-fit:cover;
border-radius:16px;
}

/* SPOTIFY FULL WIDTH */
.music-wide{
grid-column:1 / span 2;
}

.music-wide iframe{
width:100%;
height:180px;
border-radius:16px;
border:none;
}

footer{
margin-top:50px;
opacity:0.8;
font-size:15px;
}

/* RESPONSIVE */
@media(max-width:900px){
.main-box{
width:95%;
grid-template-columns:1fr;
}

.music-wide{
grid-column:auto;
}

.profile-card{
flex-direction:column;
align-items:center;
text-align:center;
}
}
</style>
</head>

<body>

<!-- VIDEO (DÙNG LUÔN ÂM THANH VIDEO) -->
<video class="bg-video" id="bgVideo" autoplay loop playsinline muted>
<source src="bg.mp4" type="video/mp4">
</video>

<div class="overlay">

<header>
<h1>Trang cá nhân</h1>
</header>

<!-- PROFILE -->
<div class="profile-card">
<img src="images/ctu.jpg">
<div class="profile-info">
<h2>Nguyễn Cẩm Tú</h2>
<p>Sinh: 27/12/2008</p>
<p>Sở thích: Du lịch • Nghe nhạc • Thủ công</p>
<p>Màu yêu thích: Xanh than</p>
</div>
</div>

<!-- CARD -->
<div class="main-box">

<div class="card">
<h3>Du lịch</h3>
<div class="hobby-img">
<img src="images/travel1.jpg">
</div>
</div>

<div class="card">
<h3>Nghe nhạc</h3>
<div class="hobby-img">
<img src="images/music.jpg">
</div>
</div>

<div class="card">
<h3>Thủ công</h3>
<div class="hobby-img">
<img src="images/craft.jpg">
</div>
</div>

<div class="card music-wide">
<h3>Nhạc yêu thích</h3>

<!-- Bạn tự paste Spotify embed vào -->
<iframe src="https://open.spotify.com/embed/track/6iycYUk3oB0NPMdaDUrN1w"></iframe>

</div>

</div>

<footer>
© 2026 Personal Website
</footer>

</div>

<script>
const video = document.getElementById("bgVideo");

/* Click lần đầu bật âm thanh video */
document.addEventListener("click",()=>{
video.muted=false;
video.play();
},{once:true});
</script>

</body>
</html>
