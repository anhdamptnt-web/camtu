<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trang cá nhân</title>


<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family: Arial, Helvetica, sans-serif;
}


body,html{
height:100%;
color:white;
overflow-x:hidden;
}


/* VIDEO NỀN */
.bg-video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
filter:brightness(0.85);
}


/* OVERLAY SOFT + BLUR TINH TẾ */
.overlay{
min-height:100vh;
background:rgba(10,20,50,0.55);
backdrop-filter:blur(12px);
display:flex;
flex-direction:column;
align-items:center;
padding:50px 20px;
}


/* HEADER */
header{
text-align:center;
margin-bottom:35px;
}


header h1{
font-size:42px;
letter-spacing:1px;
font-weight:600;
}


/* PROFILE */
.profile-card{
background:rgba(255,255,255,0.18);
backdrop-filter:blur(16px);
border-radius:26px;
padding:30px;
display:flex;
gap:25px;
max-width:720px;
width:100%;
margin-bottom:45px;
box-shadow:0 10px 35px rgba(0,0,0,0.25);
}


/* AVATAR */
.profile-card img{
width:170px;
height:170px;
border-radius:50%;
object-fit:cover;
border:4px solid rgba(255,255,255,0.7);
}


/* PROFILE TEXT */
.profile-info{
display:flex;
flex-direction:column;
gap:8px;
}


.profile-info h2{
font-size:34px;
font-weight:600;
</html>
